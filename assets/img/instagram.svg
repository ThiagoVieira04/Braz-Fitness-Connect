<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f2419"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6FF00"/>
      <stop offset="100%" stop-color="#7CBF00"/>
    </linearGradient>
  </defs>

  <!-- Fundo do ícone -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#A6FF00" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Moldura da câmera Instagram -->
  <rect x="15" y="15" width="34" height="34" rx="10" fill="#141414" stroke="url(#neonGrad)" stroke-width="2.6"/>

  <!-- Lente central com pulso suave -->
  <g transform-origin="32 32">
    <circle cx="32" cy="32" r="8.5" stroke="url(#neonGrad)" stroke-width="2.6"/>
    <circle cx="32" cy="32" r="3.2" fill="#A6FF00">
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="2s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- Flash piscando suavemente -->
  <circle cx="42" cy="22" r="2.4" fill="#A6FF00">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.1;2.8;2.1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
