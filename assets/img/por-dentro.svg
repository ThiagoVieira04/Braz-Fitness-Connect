<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f2419"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6FF00"/>
      <stop offset="100%" stop-color="#7CBF00"/>
    </linearGradient>
  </defs>

  <!-- Fundo do ícone -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#A6FF00" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Ondas de energia / pulso ao redor do visor -->
  <rect x="10" y="16" width="44" height="32" rx="8" stroke="#A6FF00" stroke-width="1.5" stroke-opacity="0.35">
    <animate attributeName="stroke-opacity" values="0.2;0.75;0.2" dur="2.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Moldura do visor de vídeo -->
  <rect x="12" y="18" width="40" height="28" rx="6" fill="#141414" stroke="url(#neonGrad)" stroke-width="2.2"/>

  <!-- Pontos de câmera / bastidores (REC) -->
  <circle cx="45" cy="24" r="2.6" fill="#ff3b30">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Barra de progresso animada na base do visor -->
  <rect x="16" y="40" width="32" height="2.4" rx="1.2" fill="#2d2d2d"/>
  <rect x="16" y="40" width="10" height="2.4" rx="1.2" fill="#A6FF00">
    <animate attributeName="width" values="4;32;4" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Ícone Play central com pulso suave -->
  <g transform-origin="32 31">
    <path d="M27.5 24.5 L39.5 31 L27.5 37.5 Z" fill="url(#neonGrad)" stroke="#A6FF00" stroke-width="1" stroke-linejoin="round"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="1.8s" repeatCount="indefinite"/>
  </g>

  <!-- Pequeno brilho superior -->
  <path d="M17 22 H24" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.8" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="2.2s" repeatCount="indefinite"/>
  </path>
</svg>
