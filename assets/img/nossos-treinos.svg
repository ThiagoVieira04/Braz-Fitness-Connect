<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f2419"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6FF00"/>
      <stop offset="100%" stop-color="#7CBF00"/>
    </linearGradient>
  </defs>

  <!-- Fundo do ícone -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#A6FF00" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Linhas de energia pulsando acima/abaixo -->
  <path d="M24 14 H40" stroke="#A6FF00" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.15;0.85;0.15" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M26 50 H38" stroke="#A6FF00" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.15;0.65;0.15" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
  </path>

  <!-- Haltere animado (levantamento suave) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,2; 0,-3; 0,2" dur="1.6s" repeatCount="indefinite"/>

    <!-- Barra central -->
    <rect x="20" y="30" width="24" height="4" rx="2" fill="#e0e0e0"/>

    <!-- Anilhas esquerda -->
    <rect x="11" y="23" width="4" height="18" rx="2" fill="#7CBF00"/>
    <rect x="16" y="19" width="5" height="26" rx="2.2" fill="url(#neonGrad)"/>

    <!-- Anilhas direita -->
    <rect x="43" y="19" width="5" height="26" rx="2.2" fill="url(#neonGrad)"/>
    <rect x="49" y="23" width="4" height="18" rx="2" fill="#7CBF00"/>

    <!-- Brilho sutil nas anilhas -->
    <line x1="18" y1="22" x2="18" y2="28" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="45" y1="22" x2="45" y2="28" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
