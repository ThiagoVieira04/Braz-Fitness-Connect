<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f2419"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6FF00"/>
      <stop offset="100%" stop-color="#7CBF00"/>
    </linearGradient>
  </defs>

  <!-- Fundo do ícone -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#A6FF00" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Etiqueta / Cartão de planos -->
  <g transform-origin="32 32">
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2.2s" repeatCount="indefinite"/>

    <!-- Moeda / Selo circular -->
    <circle cx="32" cy="32" r="17" fill="#141414" stroke="url(#neonGrad)" stroke-width="2.6"/>
    <circle cx="32" cy="32" r="13" stroke="#A6FF00" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="3 3">
      <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Símbolo $ central -->
    <path d="M32 20 V44" stroke="#A6FF00" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M37.5 26 C37.5 23.8 35.1 22.5 32 22.5 C28.9 22.5 26.5 24 26.5 26.2 C26.5 28.6 29 29.8 32 30.8 C35.2 31.8 37.8 33 37.8 35.8 C37.8 38.2 35.3 39.8 32 39.8 C28.6 39.8 26.2 38.2 26.2 35.8" stroke="url(#neonGrad)" stroke-width="2.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
