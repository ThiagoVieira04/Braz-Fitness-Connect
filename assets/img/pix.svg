<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f2419"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6FF00"/>
      <stop offset="100%" stop-color="#7CBF00"/>
    </linearGradient>
  </defs>

  <!-- Fundo do ícone -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#A6FF00" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Símbolo Pix estilizado com pulso suave -->
  <g transform-origin="32 32">
    <animateTransform attributeName="transform" type="scale" values="1;1.07;1" dur="2s" repeatCount="indefinite"/>

    <!-- Pétala superior -->
    <path d="M25.8 21.8 L30.4 17.2 C31.3 16.3 32.7 16.3 33.6 17.2 L38.2 21.8 C39.1 22.7 39.1 24.1 38.2 25 L33.6 29.6 C32.7 30.5 31.3 30.5 30.4 29.6 L25.8 25 C24.9 24.1 24.9 22.7 25.8 21.8 Z" fill="url(#neonGrad)">
      <animate attributeName="opacity" values="1;0.65;1" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Pétala inferior -->
    <path d="M25.8 39 L30.4 34.4 C31.3 33.5 32.7 33.5 33.6 34.4 L38.2 39 C39.1 39.9 39.1 41.3 38.2 42.2 L33.6 46.8 C32.7 47.7 31.3 47.7 30.4 46.8 L25.8 42.2 C24.9 41.3 24.9 39.9 25.8 39 Z" fill="url(#neonGrad)">
      <animate attributeName="opacity" values="1;0.65;1" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Pétala esquerda -->
    <path d="M17.2 30.4 L21.8 25.8 C22.7 24.9 24.1 24.9 25 25.8 L29.6 30.4 C30.5 31.3 30.5 32.7 29.6 33.6 L25 38.2 C24.1 39.1 22.7 39.1 21.8 38.2 L17.2 33.6 C16.3 32.7 16.3 31.3 17.2 30.4 Z" fill="#A6FF00">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Pétala direita -->
    <path d="M34.4 30.4 L39 25.8 C39.9 24.9 41.3 24.9 42.2 25.8 L46.8 30.4 C47.7 31.3 47.7 32.7 46.8 33.6 L42.2 38.2 C41.3 39.1 39.9 39.1 39 38.2 L34.4 33.6 C33.5 32.7 33.5 31.3 34.4 30.4 Z" fill="#A6FF00">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Núcleo central de conexão -->
    <rect x="29.5" y="29.5" width="5" height="5" rx="1.2" transform="rotate(45 32 32)" fill="#e8ffc2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
