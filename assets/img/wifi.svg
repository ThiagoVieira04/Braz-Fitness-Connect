<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f2419"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="12" y1="16" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6FF00"/>
      <stop offset="100%" stop-color="#7CBF00"/>
    </linearGradient>
  </defs>

  <!-- Fundo do ícone -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#A6FF00" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Arco externo (onda 3) -->
  <path d="M12.5 27.5 C23.3 16.7 40.7 16.7 51.5 27.5" stroke="url(#neonGrad)" stroke-width="4" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.2;0.2;0.2;1;1;0.2" keyTimes="0;0.35;0.45;0.65;0.85;1" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- Arco médio (onda 2) -->
  <path d="M19 34 C26.2 26.8 37.8 26.8 45 34" stroke="url(#neonGrad)" stroke-width="4" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.2;0.2;1;1;1;0.2" keyTimes="0;0.2;0.35;0.65;0.85;1" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- Arco interno (onda 1) -->
  <path d="M25.5 40.5 C29.1 36.9 34.9 36.9 38.5 40.5" stroke="url(#neonGrad)" stroke-width="4" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.25;1;1;1;1;0.25" keyTimes="0;0.15;0.35;0.65;0.85;1" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- Ponto central do Wi-Fi -->
  <circle cx="32" cy="47.5" r="3.8" fill="#A6FF00">
    <animate attributeName="r" values="3.4;4.2;3.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
