<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f2419"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="18" y1="12" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6FF00"/>
      <stop offset="100%" stop-color="#7CBF00"/>
    </linearGradient>
  </defs>

  <!-- Fundo do ícone -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#A6FF00" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Pulso de radar na base -->
  <ellipse cx="32" cy="49" rx="7" ry="2.6" stroke="#A6FF00" stroke-width="1.8">
    <animate attributeName="rx" values="5;14;5" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="2;4.8;2" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.85;0.1;0.85" dur="1.8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Sombra fixa na base -->
  <ellipse cx="32" cy="49" rx="6" ry="2" fill="#A6FF00" fill-opacity="0.25">
    <animate attributeName="rx" values="6;4;6" dur="1.8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Pin de localização animado -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,1; 0,-4; 0,1" dur="1.8s" repeatCount="indefinite"/>
    <path d="M32 13 C23.7 13 17 19.7 17 28 C17 38.6 30.2 46.7 31.3 47.4 C31.7 47.6 32.3 47.6 32.7 47.4 C33.8 46.7 47 38.6 47 28 C47 19.7 40.3 13 32 13 Z" fill="url(#neonGrad)"/>
    <!-- Círculo interno -->
    <circle cx="32" cy="27.5" r="6" fill="#0b0b0b"/>
    <circle cx="32" cy="27.5" r="2.6" fill="#A6FF00">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
