<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f2419"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6FF00"/>
      <stop offset="100%" stop-color="#7CBF00"/>
    </linearGradient>
  </defs>

  <!-- Fundo do ícone -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#A6FF00" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Onda externa pulsante -->
  <circle cx="32" cy="31" r="18" stroke="#A6FF00" stroke-width="1.5" stroke-opacity="0.3">
    <animate attributeName="r" values="17;22;17" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;0.05;0.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Balão do WhatsApp animado -->
  <g transform-origin="32 32">
    <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="2.2s" repeatCount="indefinite"/>

    <path d="M32 14 C22.1 14 14 21.8 14 31.4 C14 34.9 15.1 38.2 17 41 L14.8 49.2 L23.3 47 C25.9 48.4 28.9 49.2 32 49.2 C41.9 49.2 50 41.4 50 31.8 C50 22.2 41.9 14 32 14 Z" fill="#141414" stroke="url(#neonGrad)" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- Ícone de telefone interno -->
    <path d="M26.2 24.5 C25.7 24.5 24.9 24.7 24.3 25.4 C23.6 26.1 22.8 27.3 23.1 29.3 C23.4 31.3 24.9 33.7 26.9 35.7 C28.9 37.7 31.4 39.1 33.5 39.4 C35.5 39.7 36.7 38.9 37.4 38.2 C38.1 37.5 38.3 36.8 38.3 36.2 C38.3 35.7 38.1 35.4 37.6 35.1 L35.2 33.9 C34.8 33.7 34.4 33.8 34.1 34.2 L33.1 35.4 C32.8 35.7 32.4 35.8 32 35.6 C31.1 35.2 29.7 34.4 28.7 33.4 C27.7 32.4 26.9 31 26.5 30.1 C26.3 29.7 26.4 29.3 26.7 29 L27.9 28 C28.3 27.7 28.4 27.3 28.2 26.9 L27 24.5 C26.8 24.2 26.5 24.5 26.2 24.5 Z" fill="url(#neonGrad)"/>
