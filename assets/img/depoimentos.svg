<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f2419"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6FF00"/>
      <stop offset="100%" stop-color="#7CBF00"/>
    </linearGradient>
  </defs>

  <!-- Fundo do ícone -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#A6FF00" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Balão de depoimento animado -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,1; 0,-2; 0,1" dur="2.2s" repeatCount="indefinite"/>

    <!-- Corpo do balão -->
    <path d="M16 18 H48 C50.2 18 52 19.8 52 22 V38 C52 40.2 50.2 42 48 42 H29 L20 49 V42 H16 C13.8 42 12 40.2 12 38 V22 C12 19.8 13.8 18 16 18 Z" fill="#141414" stroke="url(#neonGrad)" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- 3 pontinhos de conversa animando em sequência -->
    <circle cx="24" cy="30" r="2.6" fill="#A6FF00">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.2;2.9;2.2" dur="1.5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="30" r="2.6" fill="#A6FF00">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.2;2.9;2.2" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="30" r="2.6" fill="#A6FF00">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.2;2.9;2.2" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Estrela de avaliação brilhando no canto superior direito -->
  <g transform-origin="48 16">
    <path d="M48 10 L49.6 13.8 L53.6 14.2 L50.6 16.8 L51.5 20.8 L48 18.7 L44.5 20.8 L45.4 16.8 L42.4 14.2 L46.4 13.8 Z" fill="#A6FF00">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" type="scale" values="0.9;1.12;0.9" dur="1.8s" repeatCount="indefinite"/>
  </g>
</svg>
